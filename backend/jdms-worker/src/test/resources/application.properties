# Worker integration tests: the schema comes from the core's migrations (the worker itself never migrates)
spring.flyway.locations=filesystem:../jdms-core/src/main/resources/db/migration/postgresql
jdms.storage.bucket=jdms-worker-test
jdms.storage.create-bucket=true
jdms.kms.generate-ephemeral-key=true
# Tests drive the runner; fast retries, small limits so the limit tests stay quick
jdms.worker.auto-start=false
jdms.worker.max-attempts=2
jdms.worker.backoff-base=PT0S
jdms.worker.max-input-mb=5
jdms.worker.tika.timeout=PT30S
jdms.worker.tika.max-text-chars=200000
# Outage tests pause the object store: fail fast instead of waiting a minute per call
jdms.storage.timeout=PT5S
