# Tests sign their own tokens (TestSecurityConfiguration); KeycloakIntegrationIT overrides this with a real realm.
jdms.security.issuer-uri=https://issuer.test/realms/jdms-test
# Storage and keys for tests: SeaweedFS from TestcontainersConfiguration, ephemeral local KMS master key
jdms.storage.bucket=jdms-test
jdms.storage.create-bucket=true
jdms.kms.generate-ephemeral-key=true
# Scheduled jobs are called directly by tests
jdms.storage.reconcile.cron=-
jdms.idempotency.cleanup-cron=-
jdms.access.rule-cache-ttl=PT2S
jdms.jobs.poll-interval=PT0.2S
jdms.storage.timeout=PT5S
jdms.search.timeout=PT3S
# Low limits so the rate-limit test is quick; other tests stay below them
jdms.integration.rate-limit.requests-per-second=5
jdms.integration.rate-limit.burst=30
jdms.records.disposition.cron=-
# Event redelivery is called directly by tests
jdms.events.redelivery-cron=-
jdms.events.redelivery-min-age=PT0S
