# JDMS Next core. Secrets and environment-specific values come from environment variables only (CLAUDE.md rule 1).
spring:
  application:
    name: jdms-core
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${JDMS_DB_URL}
    username: ${JDMS_DB_USERNAME}
    password: ${JDMS_DB_PASSWORD}
    hikari:
      # under overload a request waits this long for a connection, then gets 503 with Retry-After (B-13)
      connection-timeout: ${JDMS_DB_CONNECTION_TIMEOUT_MS:10000}
  modulith:
    events:
      # Outbox deliveries stuck as published or in processing (their listener failed or the node died) are marked
      # failed after this long and redelivered by EventRedelivery (B-13)
      staleness:
        published: PT5M
        processing: PT5M
        resubmitted: PT5M
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    # Resolves to db/migration/postgresql or db/migration/oracle
    locations: classpath:db/migration/{vendor}
    # Migrations run as the schema owner; the application user above gets data access only, and only INSERT and
    # SELECT on audit tables (V11, ADR-0018)
    user: ${JDMS_DB_OWNER_USERNAME}
    password: ${JDMS_DB_OWNER_PASSWORD}
    placeholders:
      app_user: ${spring.datasource.username}
  servlet:
    multipart:
      # Uploads are parsed as streams (no temp files): see DocumentController and ADR-0011
      enabled: false

server:
  port: ${JDMS_HTTP_PORT:8090}
  error:
    include-message: never
    include-stacktrace: never

jdms:
  security:
    # Keycloak realm URL; tokens must carry exactly this issuer and the jdms-api audience
    issuer-uri: ${JDMS_OIDC_ISSUER_URI}
    audience: jdms-api
  storage:
    endpoint: ${JDMS_S3_ENDPOINT}
    region: ${JDMS_S3_REGION:us-east-1}
    bucket: ${JDMS_S3_BUCKET}
    access-key: ${JDMS_S3_ACCESS_KEY}
    secret-key: ${JDMS_S3_SECRET_KEY}
  kms:
    local-master-key: ${JDMS_LOCAL_KMS_MASTER_KEY:}
  search:
    url: ${JDMS_OPENSEARCH_URL:http://localhost:9200}
    # extracted text indexed per document (characters)
    max-text-chars: 1000000
  workflow:
    # SLA of single-approval tasks; multi-stage and committee SLAs come from the DMN tables
    default-sla-hours: 24

# Embedded Flowable (ADR-0013): process definitions and DMN tables in classpath:processes/, deployed without a
# tenant (instances, tasks and decisions are tenant-scoped). Flowable manages its own ACT_* tables.
flowable:
  database-schema-update: true
  async-executor-activate: false
  check-process-definitions: true
  process-definition-location-prefix: classpath*:/processes/
  idm:
    enabled: false
  cmmn:
    enabled: false
  app:
    enabled: false
  eventregistry:
    enabled: false
  dmn:
    resource-location: classpath*:/processes/
    resource-suffixes: "**.dmn"

management:
  server:
    port: ${JDMS_MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: logstash
