# JDMS Next login theme (UI handoff §6.11, ADR-0022): the keycloak.v2 pages in the JDMS frame.
# Only template.ftl (the frame) is overridden, so every page keycloak.v2 renders (password reset, errors,
# required actions) keeps working inside it.
parent=keycloak.v2
import=common/keycloak
locales=en,ar

styles=css/styles.css css/jdms.css
# one light design; the app has no dark mode either
darkMode=false

# The environment tag beside the wordmark ("LOCAL DEVELOPMENT"); empty in production, so no tag.
envLabel=${env.JDMS_ENV_LABEL:}
