# JDMS Next CI pipeline (self-hosted GitLab, ADR-0002).
#
# Runner requirements:
# - backend:verify runs Testcontainers through a Docker-in-Docker service, so its runner must allow
#   privileged containers. If the runner mounts the host Docker socket instead, remove the `services` block and
#   the DOCKER_* / TESTCONTAINERS_HOST_OVERRIDE variables from that job.
# - Image versions are pinned; keep them in step with backend/pom.xml, frontend/package.json and .nvmrc.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

stages:
  - build
  - test
  - security

variables:
  MAVEN_IMAGE: maven:3.9.16-eclipse-temurin-25-noble
  NODE_IMAGE: node:24.22.1-bookworm-slim
  PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble
  TRIVY_IMAGE: aquasec/trivy:0.76.1
  DIND_IMAGE: docker:29.9.2-dind

.npm:
  image: $NODE_IMAGE
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund --cache "$CI_PROJECT_DIR/.npm"
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.npm/]

backend:verify:
  stage: build
  image: $MAVEN_IMAGE
  services:
    - name: $DIND_IMAGE
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    TESTCONTAINERS_HOST_OVERRIDE: docker
    MAVEN_OPTS: -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
  cache:
    key:
      files: [backend/pom.xml]
      prefix: maven
    paths: [.m2/repository/]
  script:
    # build, unit + integration tests (Testcontainers), Modulith verify, ArchUnit, SBOM, licence check
    - cd backend
    - ./mvnw -B -ntp verify
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - backend/target/bom.json
      - backend/target/bom.xml
      - backend/*/target/generated-sources/license/THIRD-PARTY.txt
    reports:
      junit:
        - backend/*/target/surefire-reports/TEST-*.xml
        - backend/*/target/failsafe-reports/TEST-*.xml
      cyclonedx:
        - backend/target/bom.json

frontend:check:
  stage: build
  extends: .npm
  script:
    - npm run lint
    - npm run typecheck
    - npm test
    - npm run build
    - npm run licence-check
    - npm run sbom
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - frontend/bom.json
      - frontend/dist/
    reports:
      cyclonedx:
        - frontend/bom.json

frontend:e2e:
  stage: test
  extends: .npm
  image: $PLAYWRIGHT_IMAGE
  needs: []
  variables:
    CI: "true"
  script:
    - npm run e2e
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - frontend/playwright-report/
      - frontend/test-results/

security:vulnerability-scan:
  stage: security
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  needs:
    - job: backend:verify
      artifacts: true
    - job: frontend:check
      artifacts: true
  variables:
    TRIVY_CACHE_DIR: $CI_PROJECT_DIR/.trivy
  cache:
    key: trivy-db
    paths: [.trivy/]
  script:
    # Fails on HIGH or CRITICAL vulnerabilities that have a fixed version available
    - trivy sbom --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 backend/target/bom.json
    - trivy sbom --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 frontend/bom.json
